[tool.poetry]
name = "loading"
version = "0.1.0"
description = "Matrix data analysis - Exercise 1: Loading Programs"
authors = ["student"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
pandas = ">=2.0.0"
numpy = ">=1.24.0"
matplotlib = ">=3.7.0"

[tool.poetry.group.dev.dependencies]
flake8 = ">=7.0.0"
mypy = ">=1.8.0"
pandas-stubs = ">=2.0.0"

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"
